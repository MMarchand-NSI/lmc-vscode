name = "lmc_vscode"
version = "1.0.0"
target = "javascript"
runtime = "node"
# Version minimale du compilateur, vérifiée à chaque `gleam build` : une
# version plus ancienne s'arrête sur « Incompatible Gleam version » au lieu de
# produire des écarts de formatage inexplicables. C'est un plancher, pas un
# épinglage — il n'installe rien, et la CI garde son VERSION= exacte.
gleam = ">= 1.18.0"
# Fill out these fields if you intend to generate HTML documentation or publish
# your project to the Hex package manager.
#
# description = ""
# licences = ["Apache-2.0"]
# repository = { type = "github", user = "", repo = "" }
# links = [{ title = "Website", href = "" }]
#
# For a full reference of all the available options, you can have a look at
# https://gleam.run/writing-gleam/gleam-toml/.

[dependencies]
gleam_stdlib = ">= 0.44.0 and < 2.0.0"
# Standalone Emulator API — see CLAUDE.md. lmc_lsp is currently private;
# local `gleam deps download` needs `gh auth login` with access to it
# (its git-credential helper handles the https:// URL below). CI instead
# rewrites this URL to SSH and authenticates with a deploy key — see
# .github/workflows/test.yml.
lmc_lsp = { git = "https://github.com/MMarchand-NSI/lmc_lsp.git", ref = "v0.8.3" }
gleam_json = ">= 3.1.0 and < 4.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
