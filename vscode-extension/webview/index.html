<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src {{cspSource}}; script-src 'nonce-{{nonce}}';" />
    <link rel="stylesheet" href="{{styleUri}}" />
    <title data-ui="pageTitle"></title>
  </head>
  <body>
    <div id="error" class="error-banner"></div>

    <!-- Barre de conduite, hors des cadres et c'est voulu : Step, Run et
         Reset ne sont pas des organes de la machine, c'est vous — un
         processeur n'a pas de bouton « pas à pas ». L'état les accompagne :
         ce n'est pas un registre non plus (LANGAGE.md n'en nomme que cinq),
         et c'est ce qu'on lit juste après avoir cliqué.

         Il y avait ici une légende rappelant l'instruction en cours. Elle a
         été retirée : l'éditeur surligne déjà la ligne exécutée, et redire
         la même chose à deux endroits n'ajoutait rien. -->
    <div class="toolbar">
      <div class="controls">
        <button id="step" type="button" data-ui="btnStep"></button>
        <button id="run" type="button" data-ui="btnRun"></button>
        <button id="reset" type="button" data-ui="btnReset"></button>
      </div>

      <span class="tip-anchor">
        <button id="assemble" type="button" class="secondary" data-ui="btnAssemble"></button>
        <span class="tip" role="tooltip"><strong data-ui="tipAssembleTitle"></strong> — <span data-ui="tipAssembleBody"></span></span>
      </span>

      <span class="tip-anchor">
        <button id="load" type="button" class="secondary" data-ui="btnLoad"></button>
        <span class="tip" role="tooltip"><strong data-ui="tipLoadTitle"></strong> — <span data-ui="tipLoadBody"></span></span>
      </span>

      <div class="register">
        <span class="label" tabindex="0" data-ui="statusLabel"></span>
        <span class="tip" role="tooltip"><strong data-ui="tipStatusTitle"></strong> — <span data-ui="tipStatusBody"></span></span>
        <span id="status" class="status">—</span>
      </div>
    </div>

    <!-- Les trois organes de l'architecture de von Neumann, un par cadre :
         le processeur, la mémoire unique, les entrées-sorties. Le découpage
         doit se voir avant même qu'on lise ce qu'il y a dedans. -->
    <div class="layout">
      <!-- Processeur et entrées-sorties empilés dans une colonne étroite :
           la grille mémoire est ce qui a besoin de largeur, pas eux. -->
      <div class="column">
        <section class="unit cpu">
          <h2 data-ui="headingProcessor"></h2>
          <div class="register">
            <span class="label" tabindex="0">ACC</span>
            <span class="tip" role="tooltip"><strong data-ui="tipAccTitle"></strong> — <span data-ui="tipAccBody"></span></span>
            <span id="acc" class="value">—</span>
          </div>
          <div class="register">
            <span class="label" tabindex="0">PC</span>
            <span class="tip" role="tooltip"><strong data-ui="tipPcTitle"></strong> — <span data-ui="tipPcBody"></span></span>
            <span id="pc" class="value">—</span>
          </div>
          <!-- SI, LR et SP n'apparaissent qu'avec les tableaux, les
               sous-programmes et la pile. Ils sont affichés plus discrètement
               qu'ACC et PC pour que les premières séances ne soient pas
               encombrées par des registres dont on ne parle pas encore. -->
          <div class="register secondary">
            <span class="label" tabindex="0">SI</span>
            <span class="tip" role="tooltip"><strong data-ui="tipSiTitle"></strong> — <span data-ui="tipSiBody"></span></span>
            <span id="x" class="value">—</span>
          </div>
          <div class="register secondary">
            <span class="label" tabindex="0">LR</span>
            <span class="tip" role="tooltip"><strong data-ui="tipLrTitle"></strong> — <span data-ui="tipLrBody"></span></span>
            <span id="lr" class="value">—</span>
          </div>
          <div class="register secondary">
            <span class="label" tabindex="0">SP</span>
            <span class="tip" role="tooltip"><strong data-ui="tipSpTitle"></strong> — <span data-ui="tipSpBody"></span></span>
            <span id="sp" class="value">—</span>
          </div>

        </section>

        <section class="unit io">
          <h2 data-ui="headingIo"></h2>
          <div class="io-part">
            <h3 data-ui="headingInput"></h3>
            <form id="input-form">
              <label for="input-value" data-ui="inputValueLabel"></label>
              <input id="input-value" type="number" inputmode="numeric" autofocus />
              <button type="submit" data-ui="btnOk"></button>
            </form>
          </div>
          <div class="io-part output-tray">
            <h3 data-ui="headingOutput"></h3>
            <ul id="output"></ul>
          </div>
          <!-- L'écran est une sortie, au même titre qu'OUT, et il est dans le
               même cadre pour cette raison : c'est un périphérique, pas un
               organe du processeur. Le canvas fait 32 × 32 pixels réels,
               agrandis par le CSS — un point du programme est donc un pixel
               du canvas, sans arithmétique nulle part. -->
          <div class="io-part screen-part">
            <h3 tabindex="0" data-ui="headingScreen"></h3>
            <span class="tip" role="tooltip"><strong data-ui="tipScreenTitle"></strong> — <span data-ui="tipScreenBody"></span></span>
            <canvas id="screen" width="32" height="32" role="img" data-ui-aria="screenAria"></canvas>
            <!-- Les pastilles sont construites par app_ffi.mjs à partir de sa
                 propre palette : une seule liste de couleurs, sinon la
                 légende finit par mentir sur ce qui est peint. -->
            <ul id="palette" class="palette"></ul>
          </div>
        </section>
      </div>

      <section class="unit memory-wrap">
        <h2 data-ui="headingMemory"></h2>
        <p class="unit-note" data-ui="memoryNote"></p>
        <div id="memory" class="memory-grid"></div>
        <!-- Les pastilles portent les mêmes classes que les cases de la
             grille, et style.css applique les mêmes règles aux deux : la
             légende ne peut pas dériver de ce qu'elle décrit. -->
        <ul class="legend">
          <li><span class="swatch"></span><span data-ui="legendProgram"></span></li>
          <li><span class="swatch data"></span><span data-ui="legendData"></span></li>
          <li><span class="swatch stack"></span><span data-ui="legendStack"></span></li>
          <li><span class="swatch unused"></span><span data-ui="legendFree"></span></li>
        </ul>
      </section>
    </div>

    <details class="cycle-details">
      <summary data-ui="cycleSummary"></summary>
      <p class="cycle-hint" data-ui="cycleHint"></p>
      <ol id="cycle-events"></ol>
    </details>

    <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
    <script nonce="{{nonce}}">LmcApp.main();</script>
  </body>
</html>
