# Publication sur le Marketplace, déclenchée par une étiquette.
#
# **L'étape de publication est conditionnelle, et c'est voulu.** Sans le secret
# `VSCE_PAT`, ce workflow construit, vérifie et attache quand même le .vsix à
# une release GitHub : il ne devient pas rouge, parce que ne pas avoir de jeton
# n'est pas une panne. Le compte de l'auteur n'appartient à aucun annuaire
# Entra (mesuré le 2026-09-06 : `az login --allow-no-subscriptions` rend `[]`,
# aucun locataire), donc ni un PAT ni `--azure-credential` ne peuvent être
# obtenus tant qu'il n'existe pas d'organisation Azure DevOps. Le chemin qui
# marche sans rien de tout cela est le **téléversement manuel** du .vsix depuis
# la page du publisher (New extension -> Visual Studio Code), et ce workflow
# produit précisément le fichier à y déposer.
#
# **`VSCE_PAT` a une date de péremption qui n'est pas la sienne.** La doc de
# VS Code fait créer le jeton avec « All accessible organizations », c'est-à-dire
# un PAT *global*, et Microsoft les supprime : création bloquée et
# décommissionnement complet annoncés pour le 1er décembre 2026
# (https://devblogs.microsoft.com/devops/retirement-of-global-personal-access-tokens-in-azure-devops/,
# lu le 2026-09-06 ; le billet porte une note de révision sur la date de blocage,
# et ne dit rien de la publication d'extensions, un commentaire l'ayant soulevé
# sans réponse). Quand ce workflow échouera à l'étape « Publish » avec une erreur
# d'authentification, ce sera probablement cela et non le secret : la relève est
# `vsce publish --azure-credential`, qui authentifie via Entra au lieu d'un jeton
# stocké, et qui existe déjà dans la version de vsce utilisée ici.
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# Le jeton vit dans le secret `VSCE_PAT` du dépôt et non sur une machine :
# `vsce login` n'a pas de trousseau à sa disposition sous WSL (keytar tombe
# sur « dbus-launch: No such file or directory ») et écrirait le jeton en
# clair dans ~/.vsce. Un secret GitHub n'est pas déchiffrable depuis
# l'interface, n'apparaît pas dans les journaux, et une PR venue d'un fork
# n'y a pas accès — ce qui compte depuis que ce dépôt est public.
#
# **Publier est irréversible** : un numéro de version consommé sur le
# Marketplace ne se republie jamais, même après un retrait. C'est pourquoi ce
# workflow rejoue toute la suite avant d'envoyer quoi que ce soit plutôt que
# de faire confiance à la CI de la branche : rien ne garantit qu'une
# étiquette est posée sur un commit vert.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # pour attacher le .vsix à la release GitHub

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Gleam
        run: |
          VERSION="1.18.1"
          curl -fsSL "https://github.com/gleam-lang/gleam/releases/download/v${VERSION}/gleam-v${VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C /tmp
          sudo mv /tmp/gleam /usr/local/bin/gleam

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Même accès à la dépendance privée que dans test.yml : le bundle du
      # serveur et la bibliothèque de l'émulateur sortent tous les deux de
      # ce clone.
      - name: Set up SSH access to the private lmc_lsp dependency
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LMC_LSP_DEPLOY_KEY }}" > ~/.ssh/lmc_lsp_deploy_key
          chmod 600 ~/.ssh/lmc_lsp_deploy_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          git config --global core.sshCommand "ssh -i ~/.ssh/lmc_lsp_deploy_key"
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      # Deux vérifications avant de dépenser cinq minutes de runner, et
      # surtout avant de publier sous un mauvais numéro : le Marketplace
      # croit `package.json`, pas l'étiquette, donc une étiquette v0.2.0 sur
      # un manifeste resté en 0.1.0 publierait 0.1.0 en silence — et
      # brûlerait ce numéro pour toujours.
      - name: The tag and the manifest must agree
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(node -p "require('./vscode-extension/package.json').version")
          echo "étiquette : $TAG, manifeste : $MANIFEST"
          test "$TAG" = "$MANIFEST"
      # Le secret passe par l'environnement et non dans la ligne de
      # commande : interpoler un secret directement dans un `run:` le met
      # dans le script que le runner écrit sur disque, et n'importe quel
      # `set -x` ou message d'erreur peut alors le recracher.
      - name: Say whether this run will publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ]; then
            echo "VSCE_PAT est présent : cette étiquette publiera sur le Marketplace."
          else
            echo "VSCE_PAT est absent : cette étiquette construira, vérifiera et attachera"
            echo "le .vsix à une release GitHub, sans publier. Ce n'est pas une erreur —"
            echo "voir le commentaire en tête de ce fichier sur le téléversement manuel."
          fi

      - run: gleam deps download
      - run: gleam test
      - run: gleam format --check src test
      - run: gleam build

      - name: Install the extension's dependencies
        run: npm ci
        working-directory: vscode-extension

      - run: node scripts/build-lsp-bundle.mjs
      - run: node scripts/check-lsp.mjs
      - run: node scripts/check-examples.mjs
      - run: node scripts/check-grammar.mjs
      - run: node scripts/check-manifest.mjs
      - run: node scripts/build-webview.mjs
      - run: node scripts/smoke-webview.mjs

      # `--out ../dist/` : le produit sort du répertoire des sources, et porte
      # son numéro de version dans son nom. C'est du rangement, pas une
      # protection : `vsce` exclut `**/*.vsix` par défaut (sa liste
      # `defaultIgnore`, vérifié en emballant avec une archive posée dans
      # `vscode-extension/` — elle n'y était pas), donc une extension ne
      # pouvait de toute façon pas contenir une copie d'elle-même.
      - name: Package
        run: |
          npm run compile
          npx vsce package --out "../dist/lmc-vscode-${GITHUB_REF_NAME#v}.vsix"
        working-directory: vscode-extension

      - name: The archive must carry the server and its marketplace page
        run: |
          unzip -l dist/*.vsix | grep -q "extension/lsp-server.mjs"
          unzip -l dist/*.vsix | grep -q "extension/vendor/lmc-lsp.bundle.mjs"
          unzip -l dist/*.vsix | grep -qi "extension/readme.md"

      # `--packagePath` publie **l'archive qui vient d'être vérifiée**, au
      # lieu d'en fabriquer une seconde : sans lui, `vsce publish` remballe
      # tout, et ce qui part n'est pas exactement ce que les lignes
      # ci-dessus ont inspecté.
      - name: Publish to the Marketplace
        if: ${{ secrets.VSCE_PAT != '' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath "../dist/lmc-vscode-${GITHUB_REF_NAME#v}.vsix"
        working-directory: vscode-extension

      # Le .vsix attaché à la release sert à installer une version précise
      # sans passer par le Marketplace (« Install from VSIX… »), et à garder
      # une trace de ce qui a été publié sous ce numéro.
      - name: Attach the .vsix to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "Published to the VS Code Marketplace. See vscode-extension/CHANGELOG.md." \
            "dist/lmc-vscode-${GITHUB_REF_NAME#v}.vsix"
