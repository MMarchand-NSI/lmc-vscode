name: test

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Le binaire gleam est autonome (écrit en Rust) et ce projet cible
      # JavaScript : Erlang n'intervient nulle part. `erlef/setup-beam`
      # n'était là que parce que c'est la façon habituelle d'obtenir gleam,
      # et elle installait OTP et rebar3 avec, pour rien — vérifié en
      # neutralisant erl/erlc/escript/rebar3 : `gleam test` et
      # `gleam format --check` passent sans qu'aucun soit appelé.
      # Télécharger le binaire, c'est aussi la recette de lmc_lsp.
      - name: Install Gleam
        run: |
          VERSION="1.18.1"
          curl -fsSL "https://github.com/gleam-lang/gleam/releases/download/v${VERSION}/gleam-v${VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C /tmp
          sudo mv /tmp/gleam /usr/local/bin/gleam

      # `gleam test` s'exécute sous node (target = "javascript"). Il était
      # jusqu'ici pris sur l'image du runner, sans version fixée : elle
      # change sans prévenir.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # gleam.toml depends on the private MMarchand-NSI/lmc_lsp repo over
      # git (Emulator API — see CLAUDE.md). `gleam deps download` shells out
      # to `git clone` on the https:// URL in gleam.toml; rewrite it to SSH
      # so it authenticates with the read-only deploy key below instead.
      - name: Set up SSH access to the private lmc_lsp dependency
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LMC_LSP_DEPLOY_KEY }}" > ~/.ssh/lmc_lsp_deploy_key
          chmod 600 ~/.ssh/lmc_lsp_deploy_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          git config --global core.sshCommand "ssh -i ~/.ssh/lmc_lsp_deploy_key"
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - run: gleam deps download
      - run: gleam test
      - run: gleam format --check src test

      # Les quatre contrôles qui ne sont pas des tests Gleam. Ils exercent
      # ce que `gleam test` ne voit pas : le serveur compilé qui parle le
      # protocole, les exemples qui tiennent leurs promesses, la grammaire
      # TextMate qui suit le lexer, et le webview construit dans un DOM.
      # Ils demandent la compilation JS et les outils de dev de l'extension
      # (jsdom, esbuild, le moteur Oniguruma), d'où les deux étapes qui
      # suivent.
      - run: gleam build
      - name: Install the extension's dev dependencies
        run: npm ci
        working-directory: vscode-extension

      # Le serveur de langage : construit ici depuis la dépendance, puis
      # soumis à la suite d'intégration de lmc_lsp elle-même.
      - run: node scripts/build-lsp-bundle.mjs
      - run: node scripts/check-lsp.mjs

      - run: node scripts/check-examples.mjs
      - run: node scripts/check-grammar.mjs

      # smoke-webview.mjs lit le bundle du webview : le construire d'abord,
      # sinon il vérifie une version périmée sans le dire.
      - run: node scripts/build-webview.mjs
      - run: node scripts/smoke-webview.mjs

      # La chaîne de packaging, celle qui produit l'extension installable.
      # `vsce package` a déjà échoué en silence ici (rien ne la lançait) :
      # une fois pour @types/vscode plus récent que engines.vscode, une
      # fois en emballant une archive sans serveur de langage dedans.
      - name: Compile and package the extension
        run: |
          npm run compile
          npx vsce package
        working-directory: vscode-extension
      # Ce que l'archive doit contenir : le serveur, son bundle, et la page
      # que le Marketplace affichera. Cette dernière manquait sans que rien
      # ne le dise — vsce l'y range en minuscules, d'où le -i.
      - name: Check the .vsix carries the server and its marketplace page
        run: |
          unzip -l vscode-extension/*.vsix | grep -q "extension/lsp-server.mjs"
          unzip -l vscode-extension/*.vsix | grep -q "extension/vendor/lmc-lsp.bundle.mjs"
          unzip -l vscode-extension/*.vsix | grep -qi "extension/readme.md"
